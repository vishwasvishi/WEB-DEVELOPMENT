        *{

            text-align: center;
        }
        #mainContainer{
            height: 100vh;
            width: 100%;

             display: flex;
             align-items: center;
             justify-content: space-evenly;
             flex-wrap: wrap;


        }
        .card{
            height: 250px;
            width: 250px;
            border: 2px solid #050806;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            flex-direction: column;
            

        }
        .card>img{
            height: 150px;
            width: 150px;
            border-radius: 20px;
        }
        .card button{
            height: 25px;
            width: 100px;
            background-color: #de8a41;
            border-radius: 20px;
            border: none;
            text-align: center;
        }
        .card button:hover{
            background-color: orangered;
        }
        
    </style>
