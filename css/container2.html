<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         section{
            height: 600px;
            width: 600px;
            /* border-width: 5px;
            border-style: solid;
            border-color: blue; */
            border-radius: 5px;
            border: 2px solid red;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }
        aside{
            height: 150px;
            width: 150px;
        }
        #c1{
            border: 2px solid green;
        }
         #c2{
            border: 2px dotted blue;
        }
         #c3{
            border: 2px dashed black;
        }
         #c4{
            border: 2px double magenta;
        }
         #c5{
            border: 2px inset purple;
        }
         #c6{
            border: 2px outset purple;
        }
         #c7{
            border: 2px groove orange;
        }
         #c8{
            border: 2px ridge purple;
        }
    </style>
</head>
<body>
    <section>
        <aside id="c1"></aside>
        <aside id="c2"></aside>
        <aside id="c3"></aside>
        <aside id="c4"></aside>
        <aside id="c5"></aside>
        <aside id="c6"></aside>
        <aside id="c7"></aside>
        <aside id="c8"></aside>
        
    </section>
</body>
</html>
