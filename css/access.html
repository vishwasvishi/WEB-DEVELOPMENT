<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Collection</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1{
            text-align: center;
        }

        #mainContainer{
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(to right, #e9e4f0, #d3cce3);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card{
            height: 350px;
            width: 250px;
            border: 2px solid #050806;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            flex-direction: column;
            background-color: white;
        }

        .card > img{
            height: 250px;
            width: 200px;
            border-radius: 20px;
            object-fit: cover;
        }

        .card button{
            height: 25px;
            width: 100px;
            background-color: #de8a41;
            border-radius: 20px;
            border: none;
            text-align: center;
            cursor: pointer;
        }

        .card button:hover{
            background-color: orangered;
            color: white;
        }

        .card p{
            font-weight: 300;
            font-size: large;
        }
    </style>
</head>

<body>

    <section id="mainContainer">

        <aside class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRh-xyP3rQSng2T2HuyVPrpzOWFhz16ZIsZGSACnyjHxg&s"
                 alt="Watch">
            <h2>Bracelet</h2>
            <p>₹ 1499</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrhsPrYcp_Gm8lbXi0zSUfqgiKRdLY5z5pwn3ywLAlyw&s=10"
                 alt="Sunglasses">
            <h2>Men Bracelet</h2>
            <p>₹ 899</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=500&q=80"
                 alt="Necklace">
            <h2>Necklace</h2>
            <p>₹ 999</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=500&q=80"
                 alt="Earrings">
            <h2>Earrings</h2>
            <p>₹ 599</p>

        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=500&q=80"
                 alt="Wallet">
            <h2>Wallet</h2>
            <p>₹ 799</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
                 alt="Handbag">
            <h2>Bag</h2>
            <p>₹ 1299</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=500&q=80"
                 alt="Bracelet">
            <h2>Handbag</h2>
            <p>₹ 499</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=500&q=80"
                 alt="Luxury Watch">
            <h2>Luxury Watch</h2>

        </aside>

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=500&q=80"

    </section>

</body>
</html>
