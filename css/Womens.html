<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Dress Collection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        #mainContainer {
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(to right, #e9e4f0, #d3cce3);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        .card {
            height: 400px;
            width: 250px;
            border: 2px solid #050806;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            flex-direction: column;
            background-color: white;
            padding: 10px;
        }

        .card > img {
            height: 270px;
            width: 200px;
            border-radius: 20px;
            object-fit: cover;
        }

        .card h2 {
            font-size: 20px;
        }

        .card p {
            font-weight: 500;
            font-size: large;
        }

        .card button {
            height: 35px;
            width: 120px;
            background-color: #de8a41;
            border-radius: 20px;
            border: none;
            text-align: center;
            cursor: pointer;
        }

        .card button:hover {
            background-color: orangered;
            color: white;
        }
    </style>
</head>

<body>

    <section id="mainContainer">

        <aside class="card">
            <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=500&q=80"
                 alt="Floral Dress">
            <h2>Floral Dress</h2>
            <p>₹ 999</p>
            <button>Buy Now</button>
        </aside>

        <aside class="card">

                 alt="Party Dress">

                 alt="Maxi Dress">

        <aside class="card">

                 alt="Summer Dress">
            <h2>Summer Dress</h2>

                 alt="Casual Dress">

                 alt="Designer Dress">

                 alt="Long Dress">
