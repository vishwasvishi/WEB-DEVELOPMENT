<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Collection</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1{
            text-align: center;
        }

        #mainContainer{
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(to right, #e9e4f0, #d3cce3);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card{
            height: 350px;
            width: 250px;
            border: 2px solid #050806;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            flex-direction: column;
            background-color: white;
        }

        .card > img{
            height: 250px;
            width: 200px;
            border-radius: 20px;
            object-fit: cover;
        }

        .card button{
            height: 25px;
            width: 100px;
            background-color: #de8a41;
            border-radius: 20px;
            border: none;
            text-align: center;
            cursor: pointer;
        }

        .card button:hover{
            background-color: orangered;
            color: white;
        }

        .card p{
            font-weight: 300;
            font-size: large;
        }
    </style>
</head>

<body>

    <section id="mainContainer">
