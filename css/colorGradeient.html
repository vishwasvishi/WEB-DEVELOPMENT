<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
         section {
            height: 600px;
            width: 600px;
            border-color: black;
            display:flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            border: 4px solid black;


        }
        aside{
            height: 150px;
            width: 150px;
            border: 4px solid red;

        }
        #c1{
            background: linear-gradient(to top, yellow,brown,blue,green );
        }
        #c2{
            background: repeating-linear-gradient(to right, rgb(203, 237, 13),rgb(218, 7, 42),rgb(12, 160, 240));
        }
        #c3{
            background: radial-gradient(orange,pink,yellow);
        }
        #c4{
            background-color: repeating-radial-gradient(orange,pink,yellow);
        }
                                                  

    </style>
</head>
<body>
    <section>
        <aside id="c1"></aside>
        <aside id="c2"></aside>
        <aside id="c3"></aside>
        <aside id="c4"></aside>
        <aside id="c5"></aside>
        <aside id="c6"></aside>
    </section>
</body>
</html>
