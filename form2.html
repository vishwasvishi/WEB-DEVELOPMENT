<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Sign Up</legend>
            <table>
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td><input type="text" id="username" placeholder="enter username" required></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" placeholder="enter password" required></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" placeholder="enter email" required></td>
                </tr>
                <tr>
                    <td><label for="phno">Phone Number:</label></td>
                    <td><input type="tel" minlength="10" maxlength="10" id="phno" placeholder="enter phone number" required></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender:</label></td>
                    <td> 
                        <label for="male">Male</label>   
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    </td> 
                    <tr>
                        <td><label for="age">age</label></td>
                    <td><input type="number" id="age" name="age" min="18" max="25" required></td>
                </tr> 
                <td>
                    <tr>
                        <td><label for="address">Address</label></td>
                        <td><textarea id="address" name="address" placeholder="enter address" required></textarea></td>
                    </tr>
                </td>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td><input type="date" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><label for="state">State:</label></td>
                    <td>
                        <select id="state" name="state" required>
                            <option value="">Select State</option>
                            <option value="maharashtra">Maharashtra</option>
                            <option value="karnataka">Karnataka</option>
                            <option value="tamilnadu">Tamil Nadu</option>
                        </select>
                    </td>
                            
                </tr>
                <tr>
                    <td><label for="range">Range:</label></td>
                    <td><input type="range" id="range" name="range" min="0" max="100" required></td>

                </tr>
                <tr>
                    <td><label for="color">Color:</label></td>
                    <td><input type="color" id="color" name="color" required></td>
                </tr>
                <tr>
                    <td><label for="file">File:</label></td>
                    <td><input type="file" id="file" name="file" required></td>
                    </tr>
                    <tr>
                    <td><label for="url">URL:</label></td>
                    <td><input type="url" id="url" name="url" required></td>
                    </tr>
                <tr>
                    <td><label for="checkbox">Checkbox:</label></td>
                    <td><input type="checkbox" id="checkbox" name="checkbox" required>
                    <label for="checkbox">Java</label>
                    <input type="checkbox" id="checkbox" name="checkbox" required>
                    <label for="checkbox">Python</label>
                    <input type="checkbox" id="checkbox" name="checkbox" required>
                    <label for="checkbox">C++</label>
                    <input type="checkbox" id="checkbox" checked name="checkbox" required>
                    <label for="checkbox" >C</label>
                    
                </td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td><input type="datetime-local" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td><input type="week" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td><input type="month" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><label for="dob">Time:</label></td>
                    <td><input type="time" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><button type="submit">Sign Up</button></td>
                    <td><button type="reset">Reset</button></td>
                </tr>
                                            
            </table>
             
            
            
                    

        </fieldset>
    </form>
</body>
</html>
