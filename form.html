<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>LOGIN</legend>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br> 

            <label for="email">Email:</label>
           <input type="email" id="email" name="email" required><br><br> 

           <label for="phno">Phone Number:</label>    
            <input type="tel" id="phno" name="phno" required><br><br>
            <lable for="gender">Gender:</lable>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female" required>  <br><br>

            <button type="submit">Login</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>

    <form>
        <fieldset>
            <legend>Sign Up</legend>
            <table>
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td><input type="text" id="username" placeholder="enter username" required></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" placeholder="enter password" required></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" placeholder="enter email" required></td>
                </tr>
                <tr>
                    <td><label for="phno">Phone Number:</label></td>
                    <td><input type="tel" minlength="10" maxlength="10" id="phno" placeholder="enter phone number" required></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender:</label></td>
                    <td> 
                        <label for="male">Male</label>   
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    </td> 
                    <tr>
                        <td><label for="age">age</label></td>
                    <td><input type="number" id="age" name="age" min="18" max="25" required></td>
                </tr> 
                <td>
                    <tr>
                        <td><lable for="address">Address</lable></td>
                        <td><input type="textarea" id="address" name="address" required ></td>
                    </tr>
                </td>
                <tr>
                    <td><button type="submit">Sign Up</button></td>
                    <td><button type="reset">Reset</button></td>
                </tr>
                                            
            </table>
             
            
            
                    

        </fieldset>
    </form>
</body>
</html>
