<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <h1>Application Form</h1>
            <table>
                <tr>
                    <td><label for="firstname">Firstname:</label></td>
                    <td><input type="text" id="firstname" placeholder="enter firstname" required></td>
                    <td><label for="lastname">Lastname:</label></td>
                    <td><input type="text" id="lastname" placeholder="enter lastname" required></td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td><input type="date" id="dob" name="dob" required></td>
                    <td><label for="age">Age:</label></td>
                    <td><input type="number" id="age" name="age" min="18" max="25" required></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender:</label></td>
                    
                    <td><select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
        </td>
                   
                    </select>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="enter email" required></td>
                </tr>

                <tr>
                    <td><label for="pa">Position Available</label></td>
                    <td><input type="radio" id="pa" name="pa"  required>
                    <label for="pa">Junior Developer</label>
                    <input type="radio" id="pa" name="pa"  required>
                    <label for="pa">Senior Developer</label>
                    <input type="radio" id="pa" name="pa" required>
                    <label for="pa">Mid level</label></td>

                        
                </tr>
                <tr>
                    <td><label for="pl">Programming Languages:</label></td>
                    <td><input type="checkbox" id="pl" name="pl" value="python">
                        <label for="pl">Python</label>
                    <input type="checkbox" id="pl" name="pl" value="java">
                        <label for="pl">Java</label>
                    <input type="checkbox" id="pl" name="pl" value="c++">
                        <label for="pl">C++</label>
                    <input type="checkbox" id="pl" name="pl" value="javascript">
                        <label for="pl">JavaScript</label>
                        </td>
                </tr>
                <tr>
                    <td><label for="pass">Password:</label></td>
                    <td><input type="password" id="pass" name="pass" required></td>
                    <td><label for="cpass">Confirm Password:</label></td>
                    <td><input type="password" id="cpass" name="cpass" required></td>
                </tr>
                <td><button type="submit">Submit</button></td>
                <td><button type="reset">Reset</button></td>
                
            </table>
        </fieldset>
    </form>
</body>
</html>
